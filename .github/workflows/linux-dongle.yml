name: Linux dongle

on:
  push:
    paths:
      - "phoneblock-dongle/**"
      - ".github/workflows/linux-dongle.yml"
  pull_request:
    paths:
      - "phoneblock-dongle/**"
      - ".github/workflows/linux-dongle.yml"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoneblock-dongle/firmware/test
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcjson-dev libcurl4-openssl-dev libssl-dev
      - name: Build native executable
        run: make phoneblock_linux
      - name: Run host suite
        run: make test